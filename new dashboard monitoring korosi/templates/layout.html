<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PLN Corrosion Monitoring Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg px-3 fixed-top" style="height: 60px;">
        <i class="fas fa-bars me-3 fs-4" style="cursor:pointer" data-bs-toggle="offcanvas" data-bs-target="#sidebar"></i>
        <img src="{{ url_for('static', filename='pln_logo.webp') }}" alt="PLN Logo" class="me-2" style="height: 35px; width: auto;">
        <span class="fw-bold">PLN UIP3BKAL CORROSION MONITORING</span>
        <div class="ms-auto d-flex gap-2">
            <div class="badge-custom"><i class="fas fa-map-marker-alt"></i> UIP3BKAL</div>
            <div class="badge-custom"><i class="fas fa-cog"></i> CONFIG</div>
        </div>
    </nav>

    <!-- Sidebar Offcanvas -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel" style="width: 250px;">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold text-primary" id="sidebarLabel">Menu Navigasi</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body p-0">
            <div class="list-group list-group-flush">
                <a href="{{ url_for('index') }}" class="list-group-item list-group-item-action py-3 px-4 border-0">
                    <i class="fas fa-home me-3 text-secondary"></i> Home
                </a>
                <a href="{{ url_for('graphics') }}" class="list-group-item list-group-item-action py-3 px-4 border-0">
                    <i class="fas fa-chart-line me-3 text-secondary"></i> Graphic
                </a>
            </div>
        </div>
    </div>

    <div class="container-fluid px-4" style="margin-top: 80px;">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Initialize all popovers
        document.addEventListener('DOMContentLoaded', function () {
            var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
            var popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
                return new bootstrap.Popover(popoverTriggerEl)
            })
        });
    </script>
</body>
</html>
